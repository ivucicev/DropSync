<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">How DropSync connects two browsers directly</title>
  <desc id="workflow-desc">Four stages: both browsers join the signaling server, exchange a WebRTC offer and ICE candidates, open a direct peer-to-peer data channel once the server steps aside, then stream and reassemble encrypted file chunks.</desc>

  <rect width="1200" height="400" rx="26" fill="#0a0a0a"/>
  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="25.25" fill="none" stroke="#1c1c1c" stroke-width="1.5"/>

  <g transform="translate(64 54)">
    <rect x="0" y="-13" width="14" height="14" rx="3.5" fill="#f5f5f0" transform="rotate(45 7 -6)"/>
    <text x="24" y="4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#8a8a86">UNDER THE HOOD</text>
  </g>

  <!-- card 1: HANDSHAKE -->
  <g transform="translate(64 96)">
    <rect width="250" height="228" rx="14" fill="#101010" stroke="#222220" stroke-width="1.25"/>
    <circle cx="30" cy="30" r="13" fill="none" stroke="#3a3a36" stroke-width="1.25"/>
    <text x="30" y="34" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#8a8a86">01</text>

    <g transform="translate(198 16)">
      <rect x="9" y="2" width="10" height="7" rx="2" fill="none" stroke="#8a8a86" stroke-width="1.3"/>
      <line x1="10" y1="9" x2="5" y2="18.5" stroke="#8a8a86" stroke-width="1.2"/>
      <line x1="18" y1="9" x2="23" y2="18.5" stroke="#8a8a86" stroke-width="1.2"/>
      <circle cx="5" cy="21.5" r="3.4" fill="none" stroke="#8a8a86" stroke-width="1.3"/>
      <circle cx="23" cy="21.5" r="3.4" fill="none" stroke="#8a8a86" stroke-width="1.3"/>
    </g>

    <text x="24" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" letter-spacing="0.5" fill="#f0f0eb">HANDSHAKE</text>
    <text x="24" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#8f8f8a">Both browsers join the</text>
    <text x="24" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#8f8f8a">signaling server (Socket.IO).</text>
  </g>

  <text x="338" y="150" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#4a4a46">→</text>

  <!-- card 2: NEGOTIATE -->
  <g transform="translate(362 96)">
    <rect width="250" height="228" rx="14" fill="#101010" stroke="#222220" stroke-width="1.25"/>
    <circle cx="30" cy="30" r="13" fill="none" stroke="#3a3a36" stroke-width="1.25"/>
    <text x="30" y="34" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#8a8a86">02</text>

    <g transform="translate(196 16)">
      <path d="M2 8 H22 M22 8 L16 3 M22 8 L16 13" fill="none" stroke="#8a8a86" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M26 20 H6 M6 20 L12 15 M6 20 L12 25" fill="none" stroke="#8a8a86" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -4)"/>
    </g>

    <text x="24" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" letter-spacing="0.5" fill="#f0f0eb">NEGOTIATE</text>
    <text x="24" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#8f8f8a">Offer, answer, and ICE</text>
    <text x="24" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#8f8f8a">candidates pass through it.</text>
  </g>

  <text x="636" y="150" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#4a4a46">→</text>

  <!-- card 3: DIRECT LINK -->
  <g transform="translate(660 96)">
    <rect width="250" height="228" rx="14" fill="#101010" stroke="#222220" stroke-width="1.25"/>
    <circle cx="30" cy="30" r="13" fill="none" stroke="#3a3a36" stroke-width="1.25"/>
    <text x="30" y="34" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#8a8a86">03</text>

    <g transform="translate(197 15)">
      <circle cx="14" cy="4.5" r="3" fill="none" stroke="#333330" stroke-width="1.1"/>
      <line x1="12" y1="7" x2="6" y2="16.5" stroke="#333330" stroke-width="1.1" stroke-dasharray="2 2.5" stroke-linecap="round"/>
      <line x1="16" y1="7" x2="22" y2="16.5" stroke="#333330" stroke-width="1.1" stroke-dasharray="2 2.5" stroke-linecap="round"/>
      <circle cx="6" cy="20" r="3" fill="none" stroke="#8a8a86" stroke-width="1.3"/>
      <circle cx="22" cy="20" r="3" fill="none" stroke="#8a8a86" stroke-width="1.3"/>
      <line x1="9" y1="20" x2="19" y2="20" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <text x="24" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" letter-spacing="0.5" fill="#f0f0eb">DIRECT LINK</text>
    <text x="24" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#8f8f8a">RTCDataChannel opens —</text>
    <text x="24" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#8f8f8a">the server steps aside.</text>
  </g>

  <text x="934" y="150" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#4a4a46">→</text>

  <!-- card 4: TRANSFER -->
  <g transform="translate(958 96)">
    <rect width="250" height="228" rx="14" fill="#101010" stroke="#2a3a30" stroke-width="1.25"/>
    <circle cx="30" cy="30" r="13" fill="#0d1712" stroke="#34d399" stroke-width="1.25"/>
    <text x="30" y="34" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#34d399">04</text>

    <g transform="translate(198 14)">
      <rect x="0" y="0" width="9" height="9" rx="1.5" fill="none" stroke="#34d399" stroke-width="1.3"/>
      <rect x="12" y="0" width="9" height="9" rx="1.5" fill="none" stroke="#34d399" stroke-width="1.3" opacity="0.6"/>
      <rect x="6" y="12" width="9" height="9" rx="1.5" fill="#34d399" opacity="0.9"/>
      <path d="M2 26 L10 26 M10 26 L7 23 M10 26 L7 29" fill="none" stroke="#5c5c58" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="24" y="80" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" letter-spacing="0.5" fill="#f0f0eb">TRANSFER</text>
    <text x="24" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#8f8f8a">8KB chunks stream, encrypt,</text>
    <text x="24" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#8f8f8a">and reassemble on arrival.</text>
  </g>
</svg>
